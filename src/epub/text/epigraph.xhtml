		<section id="epigraph" epub:type="epigraph">
			<h2 epub:type="title">Epigraph</h2>
			<blockquote epub:type="epigraph z3998:verse" xml:lang="la">
			<p>
				<span>“Ludit amor sensus, oculos perstringit, et aufert</span>
				<br/>
				<span>Libertatem anini, mira nos fascinat arte.</span>
				<br/>
				<span>Credo aliquis demon subtens precordia flammam</span>
				<br/>
				<span>Concitat, et raptam tollit de cardine mentem.”</span>
			</p>
			</blockquote>
</section>
